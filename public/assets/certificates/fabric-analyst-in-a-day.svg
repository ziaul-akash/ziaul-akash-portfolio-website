<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101f42" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)" />

  <!-- Outer Frame -->
  <rect x="30" y="30" width="1140" height="790" fill="none" stroke="url(#goldGrad)" stroke-width="3" rx="16" />
  <rect x="42" y="42" width="1116" height="766" fill="none" stroke="#263449" stroke-width="1.5" rx="12" />

  <!-- Decorative Corner Accents -->
  <path d="M 50 100 L 50 50 L 100 50" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <path d="M 1150 100 L 1150 50 L 1100 50" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <path d="M 50 750 L 50 800 L 100 800" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <path d="M 1150 750 L 1150 800 L 1100 800" fill="none" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Microsoft / MAQ Header -->
  <text x="600" y="140" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#38BDF8" text-anchor="middle">
    MICROSOFT &amp; MAQ SOFTWARE
  </text>
  <text x="600" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">
    CERTIFICATE OF COMPLETION
  </text>
  <line x1="450" y1="240" x2="750" y2="240" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Presentation text -->
  <text x="600" y="310" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle">
    THIS ACKNOWLEDGES THAT
  </text>

  <!-- Recipient Name -->
  <text x="600" y="390" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" filter="url(#shadow)">
    Ziaul Haq Akash
  </text>

  <!-- Achievement Description -->
  <text x="600" y="460" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" fill="#E2E8F0" text-anchor="middle">
    has successfully completed the intensive hands-on technical workshop
  </text>

  <!-- Course Title -->
  <rect x="250" y="495" width="700" height="70" rx="12" fill="#141F30" stroke="#38BDF8" stroke-width="1.5" />
  <text x="600" y="542" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Microsoft: Fabric Analyst in a Day
  </text>

  <!-- Coverage details -->
  <text x="600" y="615" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">
    OneLake Lakehouse Architecture • Data Ingestion &amp; Transformation • Direct Lake Power BI Modeling
  </text>

  <!-- Seal / Signature Row -->
  <circle cx="280" cy="710" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="280" cy="710" r="38" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,4" />
  <text x="280" y="705" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FCD34D" text-anchor="middle">VERIFIED</text>
  <text x="280" y="722" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">MAQ SOFTWARE</text>

  <text x="600" y="705" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E2E8F0" text-anchor="middle">
    Date Issued: September 28, 2026
  </text>
  <text x="600" y="728" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B" text-anchor="middle">
    Partner Program: MAQ Software &amp; Microsoft Partner Network
  </text>

  <text x="920" y="710" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#38BDF8" text-anchor="middle">
    AUTHENTICATED RECORD
  </text>
  <line x1="820" y1="725" x2="1020" y2="725" stroke="#475569" stroke-width="1" />
  <text x="920" y="745" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">
    Authorized Training Entity
  </text>
</svg>
