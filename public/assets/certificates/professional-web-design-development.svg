<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bitmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1626" />
      <stop offset="50%" stop-color="#11223b" />
      <stop offset="100%" stop-color="#091220" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bitmBg)" />

  <!-- Outer Frame -->
  <rect x="30" y="30" width="1140" height="790" fill="none" stroke="url(#goldGrad)" stroke-width="3" rx="16" />
  <rect x="42" y="42" width="1116" height="766" fill="none" stroke="#263449" stroke-width="1.5" rx="12" />

  <!-- Corner Accents -->
  <path d="M 50 100 L 50 50 L 100 50" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <path d="M 1150 100 L 1150 50 L 1100 50" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <path d="M 50 750 L 50 800 L 100 800" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <path d="M 1150 750 L 1150 800 L 1100 800" fill="none" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Institution Header -->
  <text x="600" y="130" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#34D399" text-anchor="middle">
    BASIS INSTITUTE OF TECHNOLOGY &amp; MANAGEMENT (BITM)
  </text>
  <text x="600" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">
    CERTIFICATE OF ACHIEVEMENT
  </text>
  <line x1="450" y1="230" x2="750" y2="230" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Presentation text -->
  <text x="600" y="300" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle">
    THIS IS PROUDLY CONFERRED UPON
  </text>

  <!-- Recipient Name -->
  <text x="600" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" filter="url(#shadow)">
    Ziaul Haq Akash
  </text>

  <!-- Description -->
  <text x="600" y="450" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" fill="#E2E8F0" text-anchor="middle">
    for successfully completing the comprehensive professional program in
  </text>

  <!-- Program Title Box -->
  <rect x="230" y="485" width="740" height="70" rx="12" fill="#141F30" stroke="#34D399" stroke-width="1.5" />
  <text x="600" y="532" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Professional Web Design and Development
  </text>

  <!-- Details -->
  <text x="600" y="605" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">
    Full-Stack Web Foundations • Responsive Systems • Dynamic Applications
  </text>

  <!-- Bottom Row: Seal and Signature -->
  <circle cx="280" cy="700" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="280" cy="700" r="38" fill="none" stroke="#34D399" stroke-width="1" stroke-dasharray="4,4" />
  <text x="280" y="695" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FCD34D" text-anchor="middle">VERIFIED</text>
  <text x="280" y="712" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">BITM / BASIS</text>

  <text x="600" y="695" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E2E8F0" text-anchor="middle">
    Date Issued: April 2017
  </text>
  <text x="600" y="718" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B" text-anchor="middle">
    Institution: BASIS Institute of Technology &amp; Management Limited
  </text>

  <text x="920" y="700" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#34D399" text-anchor="middle">
    ACCREDITED RECORD
  </text>
  <line x1="820" y1="715" x2="1020" y2="715" stroke="#475569" stroke-width="1" />
  <text x="920" y="735" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">
    Director &amp; Chief Academic Officer
  </text>
</svg>
